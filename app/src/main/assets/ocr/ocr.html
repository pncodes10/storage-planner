<!doctype html>
<meta charset="utf-8">
<!-- Storage Planner's text reader: Tesseract (tesseract.js, Apache-2.0) running on the phone.
     Every file is served from inside the app; the app has no internet permission. -->
<script src="tesseract.min.js"></script>
<script>
let scheduler = null;
async function start(workers) {
  try {
    scheduler = Tesseract.createScheduler();
    for (let i = 0; i < workers; i++) {
      const w = await Tesseract.createWorker('eng', 1, {
        workerPath: '/ocr/worker.min.js', corePath: '/ocr/', langPath: '/ocr/', gzip: false, cacheMethod: 'none', logger: () => {}
      });
      scheduler.addWorker(w);
    }
    Native.ready(workers);
  } catch (e) {
    Native.failed(-1, String(e && e.message || e));
  }
}
function words(r) {
  const out = [];
  for (const b of (r.data.blocks || [])) for (const p of b.paragraphs) for (const l of p.lines) for (const w of l.words)
    out.push([w.text, Math.round(w.confidence)]);
  return JSON.stringify(out);
}
async function read(id) {
  try {
    Native.done(id, words(await scheduler.addJob('recognize', '/img/' + id, {}, {text: false, blocks: true})));
  } catch (e) {
    Native.failed(id, String(e && e.message || e));
  }
}
// Marathi and Hindi (Devanagari script): its own reader, started the first time it is needed
let indic = null;
async function readIndic(id) {
  try {
    if (!indic) indic = await Tesseract.createWorker('mar+hin', 1, {
      workerPath: '/ocr/worker.min.js', corePath: '/ocr/', langPath: '/ocr/', gzip: false, cacheMethod: 'none', logger: () => {}
    });
    Native.done(id, words(await indic.recognize('/img/' + id, {}, {text: false, blocks: true})));
  } catch (e) {
    Native.failed(id, String(e && e.message || e));
  }
}
</script>
