name: Build APK

# Builds the installable APK on every push (and on demand from the Actions tab),
# with the same offline script as the released APKs (tools/build_offline.sh), using the Android SDK
# that comes with GitHub's Ubuntu runners. Download it from the run's "Artifacts" section.
#
# (No pull_request trigger: a pull request run cannot read the branch's cache, so it would sign with a
# different key. Pushes to a pull request's branch are built anyway.)
# Signing: every build is signed with the same key, so a new APK installs as an update over the last one.
# The key is made on the first build and kept in the Actions cache (GitHub drops caches that go unused for
# 7 days; the next build would then make a new key, and the app has to be uninstalled once).
# For a key that never changes, add these repository secrets (Settings > Secrets and variables > Actions);
# with the key the released 1.8.1 APK was signed with, builds also install over that release:
#   SIGNING_KEY_PEM       contents of key.pem
#   SIGNING_CERT_DER_B64  cert.der as base64 (base64 -w0 cert.der)

on:
  push:
    paths: ["app/**", "tools/**", "jvmtest/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages (signer, audit)
        run: pip install cryptography androguard apksigtool loguru

      - name: Core tests (compression tools, plain-Java parts)
        run: |
          mkdir -p "$RUNNER_TEMP/jvm"
          T=app/src/main/java/com/storageplanner/tools
          javac -encoding UTF-8 -nowarn -d "$RUNNER_TEMP/jvm" \
            $(find app/src/main/java/com/storageplanner/core app/src/main/java/com/google -name "*.java") \
            $T/Exif.java $T/WebpMeta.java $T/CopyPaths.java $T/Ssim.java app/src/main/java/com/storageplanner/app/Ssim.java \
            jvmtest/com/storageplanner/test/CompressionTest.java
          java -cp "$RUNNER_TEMP/jvm" com.storageplanner.test.CompressionTest

      - name: Android SDK parts
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "platforms;android-29" "build-tools;34.0.0" > /dev/null
          TC="$RUNNER_TEMP/toolchain"; mkdir -p "$TC"
          ln -s "$SDK/platforms/android-34/android.jar" "$TC/android-34.jar"
          ln -s "$SDK/platforms/android-29/android.jar" "$TC/android-29.jar"
          ln -s "$SDK/build-tools/34.0.0/lib/d8.jar" "$TC/r8.jar"          # d8.jar is the R8 jar (contains D8)
          ln -s "$SDK/build-tools/34.0.0/aapt2" "$TC/aapt2"
          ln -s "$JAVA_HOME" "$TC/java17"
          echo "TOOLCHAIN=$TC" >> "$GITHUB_ENV"

      # One signing key for every build, so each new APK installs as an update over the last one.
      # Android only updates an app when the new APK is signed with the same key as the installed one.
      # Order: the SIGNING_* secrets if set (e.g. the key the released APK was signed with), else the key kept
      # in the Actions cache (made on the first build and reused from then on).
      - name: Restore the build signing key
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: .ci-signing
          key: apk-signing-key-v1

      - name: Signing key
        env:
          KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}
          CERT_B64: ${{ secrets.SIGNING_CERT_DER_B64 }}
        run: |
          KS="$GITHUB_WORKSPACE/.ci-signing"
          if [ -n "$KEY_PEM" ] && [ -n "$CERT_B64" ]; then
            KS="$RUNNER_TEMP/keystore"; mkdir -p "$KS"; chmod 700 "$KS"
            printf '%s\n' "$KEY_PEM" > "$KS/key.pem"
            printf '%s' "$CERT_B64" | base64 -d > "$KS/cert.der"
            echo "SIGNED=release key from the repository secrets" >> "$GITHUB_ENV"
          elif [ -f "$KS/key.pem" ] && [ -f "$KS/cert.der" ]; then
            echo "SIGNED=the build key kept in the Actions cache (same as earlier builds)" >> "$GITHUB_ENV"
          else
            mkdir -p "$KS"; chmod 700 "$KS"            # apkbuild.py creates the key here; saved to the cache below
            echo "::warning::First build with a kept key: uninstall the app once before installing this APK. Later builds install as updates."
            echo "SIGNED=a new build key, kept for later builds (uninstall the app once before installing)" >> "$GITHUB_ENV"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_DIR=$KS" >> "$GITHUB_ENV"

      - name: Build
        run: |
          VC=$(sed -n "s/.*versionCode \([0-9]*\).*/\1/p" app/build.gradle)
          VN=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          SHA=$(git rev-parse --short HEAD)
          export VERSION_CODE="$VC" VERSION_NAME="$VN-$SHA"
          bash tools/build_offline.sh
          NAME="StoragePlanner-$VN-$SHA.apk"
          cp build/offline/StoragePlanner.apk "build/offline/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          {
            echo "### $NAME"
            echo "- version $VN-$SHA (code $VC)"
            echo "- signed with: $SIGNED"
            echo "- signing certificate SHA-256: \`$(sha256sum "$KEYSTORE_DIR/cert.der" | cut -d' ' -f1)\` (the same for every APK that installs as an update)"
            echo "- size: $(du -h "build/offline/$NAME" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the new build signing key
        if: env.NEW_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: .ci-signing
          key: apk-signing-key-v1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: build/offline/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Audit the APK
        run: python3 tools/audit_apk.py "build/offline/$APK_NAME" build/offline/classes
